name: Brew - Cask Style Fix

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'Casks/**.rb'
  workflow_dispatch:

concurrency:
  group: cask-style
  cancel-in-progress: false

jobs:
  style:
    name: brew style --fix
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.31.1

      - name: Style casks
        run: brew style --fix Casks/

      - uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "fix: Automatic `brew style --fix Casks/`"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: 'Casks/*.rb'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
